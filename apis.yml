name: 01 Advisors
description: '01 Advisors (01A) is an early-growth venture capital and advisory firm
  founded in 2018 by former Twitter CEO Dick Costolo and former Twitter COO Adam Bain,
  with former Facebook Chief Revenue Officer David Fischer as a third general partner.
  Headquartered in San Francisco with a New York office, the firm positions itself
  as "venture coaches" that deliberately avoid taking board seats, focusing on Series
  B companies with product-market fit that need help building professional sales organizations
  and revenue operations. It manages roughly $920M across multiple funds. Added to
  the API Evangelist network as a venture-capital portfolio lead surfaced via foundry-group;
  the firm runs a corporate marketing website (Squarespace) and publishes no public
  API, developer portal, or machine-readable surface.'
